name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - run: node scripts/generate-skill.mjs --check

  release:
    concurrency:
      group: chowa-release-main
      cancel-in-progress: false
    needs: check-skill
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/bump-version.mjs
        id: bump
      - name: Commit and publish release tags
        if: steps.bump.outputs.bumped == 'true' || steps.bump.outputs.restore_base_tag == 'true'
        env:
          RELEASE_VERSION: ${{ steps.bump.outputs.version }}
          RELEASE_BUMPED: ${{ steps.bump.outputs.bumped }}
          RELEASE_BASE_TAG: ${{ steps.bump.outputs.base_tag }}
          RELEASE_BASE_SHA: ${{ steps.bump.outputs.base_sha }}
          RELEASE_RESTORE_BASE: ${{ steps.bump.outputs.restore_base_tag }}
        run: bash scripts/publish-release.sh
